<div class="toast-container">
  <div *ngFor="let notif of notifications$ | async" 
       class="toast" 
       [class.toast-success]="notif.type === 'success'"
       [class.toast-error]="notif.type === 'error'">
    <span class="toast-icon">{{ getIconClass(notif.type) }}</span>
    <span class="toast-message">{{ notif.message }}</span>
  </div>
</div>
